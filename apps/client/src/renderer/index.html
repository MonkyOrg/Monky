<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Scripts come only from the app itself (E-MAIN-3): markup that slips past
       escaping cannot run inline handlers, javascript: URLs or injected scripts.
       blob: is for the AudioWorklets built at runtime and 'wasm-unsafe-eval' for
       noise suppression. Servers live on arbitrary hosts, so their images, media
       and connections may use any http(s) or ws(s) address. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: http: https: data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src https://open.spotify.com monky-miniapp:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monky</title>
  <link rel="icon" type="image/png" href="./assets/Logo.png">
  <!-- Fonts are bundled, not fetched: the app has to render its icons on a LAN
       with no internet access (#457). Must come before theme.css, which
       overrides the icon class shipped by the material-symbols package. -->
  <link rel="stylesheet" href="./styles/fonts.css">
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/dropdowns.css">
  <link rel="stylesheet" href="./styles/footerControls.css">
</head>
<body>
  <div id="titlebar" class="titlebar">
    <div class="titlebar__drag">
      <img class="titlebar__logo" src="./assets/Logo.png" alt="" />
      <span class="titlebar__title">Monky</span>
    </div>
    <div class="titlebar__controls">
      <button id="win-min" class="titlebar__btn" aria-label="Minimizar" title="Minimizar">
        <span class="material-symbols-outlined md-18">remove</span>
      </button>
      <button id="win-max" class="titlebar__btn" aria-label="Maximizar" title="Maximizar">
        <span class="material-symbols-outlined md-14">crop_square</span>
      </button>
      <button id="win-close" class="titlebar__btn titlebar__btn--close" aria-label="Fechar" title="Fechar">
        <span class="material-symbols-outlined md-18">close</span>
      </button>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
