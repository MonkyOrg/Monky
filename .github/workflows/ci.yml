name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Exercises the exact shipped binaries on Apple Silicon and Intel hardware instead of recompiling.
  mac-native-sources:
    needs: mac-native
    uses: ./.github/workflows/native-macos-validation.yml
    with:
      runtime-artifact: ${{ needs.mac-native.outputs.artifact }}

  light-native:
    name: Light native (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            arch: x64
          - os: macos-15-intel
            target: macos-x64
            arch: x64
          - os: macos-15
            target: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      # The pinned CMake wheel (36-48 MB) can take minutes from PyPI; keep it in the pip cache,
      # keyed by the manifest that pins its version.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/light/dependencies.json
      - name: Read native toolchain pins
        id: native-tools
        shell: pwsh
        run: |
          $manifest = Join-Path 'apps' (Join-Path 'light' 'dependencies.json')
          $tools = (Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json).buildTools
          if ($tools.ciCmake -notmatch '^\d+\.\d+\.\d+$' -or $tools.ciXcode -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw 'Invalid native toolchain version in dependencies.json'
          }
          "cmake=$($tools.ciCmake)" >> $env:GITHUB_OUTPUT
          "xcode=$($tools.ciXcode)" >> $env:GITHUB_OUTPUT
      - name: Select the qualified Xcode toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ steps.native-tools.outputs.xcode }}.app/Contents/Developer"
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Install the compatible CMake series
        run: python -m pip install --disable-pip-version-check cmake==${{ steps.native-tools.outputs.cmake }}
      - name: Cache verified SDK archives
        uses: actions/cache@v4
        with:
          path: apps/light/build/downloads
          key: light-sdk-${{ matrix.target }}-${{ hashFiles('apps/light/dependencies.json') }}
      - name: Install build-time JavaScript dependencies
        run: |
          npm ci --ignore-scripts
          npm run postinstall
      - name: Build native components
        run: npm run build:light -- --arch ${{ matrix.arch }}
      - name: Prepare an isolated macOS test Keychain
        if: runner.os == 'macOS'
        run: python scripts/macos-test-keychain.py setup
      - name: Exercise native components without media devices
        # Keep the realtime audio clock check isolated from the other native processes.
        run: node --test --test-concurrency=1 scripts/test-light-contracts.js scripts/test-light-build.js apps/light/test/platform_components.test.cjs apps/light/test/identity_key_interop.test.cjs apps/light/test/console_control.test.cjs apps/light/test/websocket_transport.test.cjs
      # mediasoup has no prebuilt worker for every host (darwin-x64 compiles it for ~8 min). The
      # key pins the exact locked package, host image and compiler; a restored worker passes the
      # same checks as a fresh one and is saved only after the real interoperability tests.
      - name: Identify the mediasoup worker build
        id: mediasoup
        run: node scripts/mediasoup-worker.cjs key
      - name: Restore the verified mediasoup worker
        id: mediasoup-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.mediasoup.outputs.path }}
          key: ${{ steps.mediasoup.outputs.key }}
      - name: Prepare disposable voice interoperability fixtures
        run: |
          npm rebuild esbuild
          npm run build --workspace=apps/server
      - name: Install the mediasoup worker
        if: steps.mediasoup-cache.outputs.cache-hit != 'true'
        run: npm rebuild mediasoup
      - name: Verify the mediasoup worker on this host
        run: node scripts/mediasoup-worker.cjs verify
      - name: Install Electron runtime before tests
        run: npm exec --no -- install-electron
      - name: Exercise native and Chromium voice through a real isolated server
        run: node --test apps/light/test/server_fixture.test.cjs apps/light/test/headless_interop.test.cjs apps/light/test/audio_devices.test.cjs apps/light/test/browser_interop.test.cjs
      - name: Save the verified mediasoup worker
        if: steps.mediasoup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.mediasoup.outputs.path }}
          key: ${{ steps.mediasoup.outputs.key }}
      - name: Restore macOS Keychain configuration
        if: always() && runner.os == 'macOS'
        run: python scripts/macos-test-keychain.py restore

  bot-tests:
    name: Bot interactions and SDK package
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python 3.11 (artifact regression tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies without native build scripts
        run: |
          npm ci --ignore-scripts
          npm run postinstall
      - name: Prepare the SFU worker for real voice transport tests
        run: npm rebuild mediasoup
      - name: Build shared contracts
        run: npm run build --workspace=packages/shared
      - name: Test bot contracts and SDK
        run: |
          node scripts/test-versioning.js
          node scripts/test-changelog.js
          node --test scripts/test-light-contracts.js scripts/test-light-build.js scripts/test-native-ci.js scripts/test-ci-build-artifact.js
          npm run test --workspace=packages/shared
          npm run test --workspace=packages/bot-sdk
      - name: Test server, client state and real bot conversations
        run: |
          npm run build --workspace=apps/server
          npm run test:bots --workspace=apps/server
          npm run test:community --workspace=apps/server
          node --test apps/server/dist/test-online-preview.js apps/server/dist/test-voice.js apps/server/dist/test-voice-mode.js apps/server/dist/test-screen-subscriptions.js apps/server/dist/test-server-settings.js apps/server/dist/test-startup-lifecycle.js
          # libuiohook initializes X11 even when the tests inject a passive mock.
          xvfb-run -a npm run test --workspace=apps/client
          npm exec -- tsc -p apps/client/tsconfig.electron.json
          node scripts/test-bot-e2e.js
      - name: Exercise an isolated SDK installation
        run: |
          node scripts/pack-bot-sdk.js 0.0.0-ci
          node scripts/test-bot-sdk-package.js release/monky-bot-sdk-0.0.0-ci.tgz
      - name: Export verified CLI build
        run: node scripts/ci-build-artifact.js collect cli "${{ runner.temp }}/ci-build-cli"
      - name: Upload reusable CLI build
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build-cli
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  docs-sync:
    name: Docs traduzidos em sincronia
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Documentacao aqui deriva: ja aconteceu com o caminho de Configuracoes no
    # template de bug e com as colunas do board no AGENTS.md. Com README e
    # CONTRIBUTING em dois idiomas a superficie dobra, entao o CI cobra o par.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test client release-note gate
        run: node --test scripts/test-client-release-notes.js

      - name: Require bilingual client release notes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-client-release-notes.js --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base

      - name: Conferir slug dos templates de discussao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # O GitHub aplica o template de discussao casando o nome do arquivo
          # com o slug da categoria. Quando nao casa, o formulario simplesmente
          # nao aparece — sem erro e sem aviso. Ja aconteceu duas vezes aqui.
          slugs=$(gh api graphql -f query='
            { repository(owner: "${{ github.repository_owner }}", name: "'"${GITHUB_REPOSITORY#*/}"'") {
                discussionCategories(first: 50) { nodes { slug } } } }' \
            -q '.data.repository.discussionCategories.nodes[].slug')

          echo "Categorias existentes:"; echo "$slugs" | sed 's/^/  /'

          fail=0
          shopt -s nullglob
          for f in .github/DISCUSSION_TEMPLATE/*.yml .github/DISCUSSION_TEMPLATE/*.yaml; do
            base=$(basename "$f"); slug="${base%.*}"
            if ! echo "$slugs" | grep -Fxq "$slug"; then
              echo "::error file=$f::Nao existe categoria de Discussions com o slug '$slug'. O template nao sera aplicado."
              fail=1
            else
              echo "  ok: $base casa com a categoria '$slug'"
            fi
          done
          exit $fail

      - name: Conferir pares PT/EN
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ -z "$BASE" ]; then
            echo "Sem contexto de PR (execucao manual) — nada a conferir."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Arquivos alterados:"; echo "$changed" | sed 's/^/  /'

          fail=0
          check_pair() {
            local pt="$1" en="$2"
            local pt_changed en_changed
            pt_changed=$(echo "$changed" | grep -Fx "$pt" || true)
            en_changed=$(echo "$changed" | grep -Fx "$en" || true)
            if [ -n "$pt_changed" ] && [ -z "$en_changed" ]; then
              echo "::error file=$pt::$pt mudou mas $en nao. Atualize a traducao no mesmo PR."
              fail=1
            fi
            if [ -n "$en_changed" ] && [ -z "$pt_changed" ]; then
              echo "::error file=$en::$en mudou mas $pt nao. Atualize a versao em portugues no mesmo PR."
              fail=1
            fi
          }

          check_pair "README.md" "README.en.md"
          check_pair "CONTRIBUTING.md" "CONTRIBUTING.en.md"
          check_pair "apps/light/README.md" "apps/light/README.en.md"
          check_pair "apps/light/QA.md" "apps/light/QA.en.md"
          check_pair "apps/client/native/screen-share/README.md" "apps/client/native/screen-share/README.en.md"

          # O site de docs (VitePress) tem PT na raiz de docs-site/ e EN em
          # docs-site/en/. Cada pagina precisa manter o par no mesmo PR.
          shopt -s nullglob
          for pt in docs-site/*.md; do
            base=$(basename "$pt")
            if [ ! -f "docs-site/en/$base" ]; then
              echo "::error file=$pt::$pt nao tem pagina correspondente em docs-site/en/$base."
              fail=1
            fi
            check_pair "$pt" "docs-site/en/$base"
          done

          for en in docs-site/en/*.md; do
            base=$(basename "$en")
            if [ ! -f "docs-site/$base" ]; then
              echo "::error file=$en::$en nao tem pagina correspondente em docs-site/$base."
              fail=1
            fi
          done

          if [ "$fail" -eq 0 ]; then
            echo "Pares PT/EN consistentes."
          fi
          exit $fail

      # Subir o PROTOCOL_VERSION faz cliente e servidor se recusarem (validators
      # exige igualdade exata), entao e breaking change e precisa sair como
      # major. Ja passou como `feat:` uma vez e publicou uma minor (#338).
      - name: Mudanca de protocolo exige release major
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: node scripts/check-protocol-bump.js

  client-dom:
    name: Client DOM (Windows ${{ matrix.shard }}/3)
    # Shards balance the measured suite cost; each one still reports every failure it finds.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '2022'
          toolset: '14.44'
          sdk: '10.0.26100.0'
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime before tests
        run: npm exec --no -- install-electron
      - name: Build workspaces
        run: npm run build
      - name: Install FFmpeg for generated voice fixtures
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -hide_banner -version
      - name: Exercise client DOM and microphone state in Electron
        env:
          MONKY_DOM_SHARD: ${{ matrix.shard }}/3
        run: node scripts/test-client-dom.cjs

  client-dom-mac:
    name: Client DOM (macOS ${{ matrix.shard }}/2)
    # The DOM suite needs no native screen runtime, so it reports from the start of the run
    # instead of after the native build. Two shards keep the run within the five-macOS-job limit.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime before tests
        run: npm exec --no -- install-electron
      - name: Build workspaces
        run: npm run build
      - name: Install FFmpeg for generated voice fixtures
        run: |
          # Homebrew's minimal formula omits libvorbis; use the complete codec set.
          brew install ffmpeg-full
          ffmpeg_bin="$(brew --prefix ffmpeg-full)/bin"
          echo "$ffmpeg_bin" >> "$GITHUB_PATH"
          export PATH="$ffmpeg_bin:$PATH"
          ffmpeg -hide_banner -version
          ffmpeg -hide_banner -encoders | grep -E '^[[:space:]]*A[^[:space:]]*[[:space:]]+libvorbis[[:space:]]'
      - name: Prepare an isolated macOS test Keychain
        run: python scripts/macos-test-keychain.py setup
      - name: Exercise client DOM and microphone state in Electron
        env:
          MONKY_DOM_SHARD: ${{ matrix.shard }}/2
        run: node scripts/test-client-dom.cjs
      - name: Restore macOS Keychain configuration
        if: always()
        run: python scripts/macos-test-keychain.py restore

  # Native outputs are cached only under an exact key of their sources, recipes, pins and
  # toolchain (scripts/native-cache-key.cjs). A hit restores what a rebuild would produce and
  # still repeats the build's acceptance checks before anything uses it.
  mac-native:
    name: Native macOS runtime
    timeout-minutes: 75
    runs-on: macos-15
    outputs:
      artifact: mac-native-runtime-${{ github.run_attempt }}
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build-time JavaScript dependencies
        run: |
          npm ci --ignore-scripts
          npm run postinstall
      - name: Identify native runtime inputs and toolchain
        id: key
        run: node scripts/native-cache-key.cjs mac
      - name: Restore verified native runtime
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/client/native/screen-share/bin/darwin-arm64
            apps/client/native/screen-share/bin/darwin-x64
          key: ${{ steps.key.outputs.key }}
      - name: Build native macOS runtime
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          arch -x86_64 /usr/bin/true
          node apps/client/native/screen-share/scripts/prepareMacRtc.cjs
          for architecture in arm64 x64; do
            node apps/client/native/screen-share/scripts/buildMac.cjs --arch=$architecture
            node apps/client/native/screen-share/scripts/buildMacRtc.cjs --arch=$architecture
          done
      - name: Verify native runtime against this checkout
        run: |
          arch -x86_64 /usr/bin/true
          node apps/client/native/screen-share/scripts/verifyOutputs.cjs mac
      - name: Save verified native runtime
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/client/native/screen-share/bin/darwin-arm64
            apps/client/native/screen-share/bin/darwin-x64
          key: ${{ steps.key.outputs.key }}
      # tar keeps the executable modes that upload-artifact would drop.
      - name: Bundle native runtime
        run: tar -cf "$RUNNER_TEMP/mac-native-runtime.tar" -C apps/client/native/screen-share bin/darwin-arm64 bin/darwin-x64
      - name: Upload native runtime for packaging and hardware validation
        uses: actions/upload-artifact@v4
        with:
          name: mac-native-runtime-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-native-runtime.tar
          if-no-files-found: error
          retention-days: 1

  # Corresponding sources and notices need the pinned checkout and the GN graph, not compiled
  # objects, so they run beside compilation. Packaging verifies the binaries against them. They
  # depend only on the committed native inputs and pins (sources_key, independent of the toolchain),
  # so a hit returns the exact archive CI already packed, verified again before use.
  mac-sources:
    name: Native macOS corresponding sources
    timeout-minutes: 60
    runs-on: macos-15
    outputs:
      artifact: mac-native-sources-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build-time JavaScript dependencies
        run: |
          npm ci --ignore-scripts
          npm run postinstall
      - name: Identify native source inputs
        id: key
        run: node scripts/native-cache-key.cjs mac
      - name: Restore verified corresponding sources
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            release/monky-native-macos-sources-0.0.0-ci.json
            release/monky-native-macos-sources-0.0.0-ci.tar.xz
            apps/client/native/screen-share/licenses
            apps/client/native/screen-share/LICENSE
            apps/client/native/screen-share/THIRD_PARTY_NOTICES
          key: ${{ steps.key.outputs.sources_key }}
      - name: Prepare the pinned macOS RTC SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: node apps/client/native/screen-share/scripts/prepareMacRtc.cjs
      - name: Generate notices from both GN target graphs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for architecture in arm64 x64; do
            node apps/client/native/screen-share/scripts/buildMacRtc.cjs --arch=$architecture --configure
          done
          node apps/client/native/screen-share/scripts/notices.cjs --mac --architectures=arm64,x64
      - name: Package corresponding sources with parallel xz
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MONKY_SOURCE_XZ: required
        run: |
          command -v xz >/dev/null || brew install xz
          node apps/client/native/screen-share/scripts/packMacSources.cjs --version=0.0.0-ci --architectures=arm64,x64
      - name: Verify corresponding sources against this checkout
        run: node scripts/native-sources-cache.cjs verify mac
      - name: Save verified corresponding sources
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            release/monky-native-macos-sources-0.0.0-ci.json
            release/monky-native-macos-sources-0.0.0-ci.tar.xz
            apps/client/native/screen-share/licenses
            apps/client/native/screen-share/LICENSE
            apps/client/native/screen-share/THIRD_PARTY_NOTICES
          key: ${{ steps.key.outputs.sources_key }}
      - name: Bundle corresponding sources and notices
        run: >-
          tar -cf "$RUNNER_TEMP/mac-native-sources.tar"
          apps/client/native/screen-share/licenses apps/client/native/screen-share/LICENSE
          apps/client/native/screen-share/THIRD_PARTY_NOTICES
          release/monky-native-macos-sources-0.0.0-ci.json release/monky-native-macos-sources-0.0.0-ci.tar.xz
      - name: Upload corresponding sources for packaging
        uses: actions/upload-artifact@v4
        with:
          name: mac-native-sources-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-native-sources.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package-win:
    name: Package check (win)
    timeout-minutes: 90
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '2022'
          toolset: '14.44'
          sdk: '10.0.26100.0'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime before tests
        run: npm exec --no -- install-electron

      - name: Use lockfile node-gyp (Windows)
        shell: pwsh
        run: |
          $NodeGyp = node -p "require.resolve('node-gyp/bin/node-gyp.js')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NODE_GYP_PATH=$NodeGyp" >> $env:GITHUB_ENV

      - name: Build workspaces
        run: npm run build

      - name: Select Python for native tooling (Windows)
        shell: pwsh
        run: '"PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV'

      - name: Identify native runtime inputs and toolchain
        id: key
        run: node scripts/native-cache-key.cjs win

      - name: Restore verified native runtime
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/client/native/screen-share/bin/win32-x64
            apps/client/native/screen-share/licenses
            apps/client/native/screen-share/LICENSE
            apps/client/native/screen-share/THIRD_PARTY_NOTICES
          key: ${{ steps.key.outputs.key }}

      # Corresponding sources depend only on the committed native inputs and pins (sources_key).
      - name: Restore verified corresponding sources (Windows)
        id: sources
        uses: actions/cache/restore@v4
        with:
          path: |
            release/monky-native-sources-0.0.0-ci.json
            release/monky-native-sources-0.0.0-ci.tar.xz
          key: ${{ steps.key.outputs.sources_key }}

      # Only content-addressed upstream archives are shared here. Compiled outputs use the
      # exact-key runtime cache above and are verified against this checkout after restore.
      # The archives (~240 MB) feed only the build or the source fetch below, so they are not
      # restored, nor saved again in this PR's scope, when both exact caches hit.
      - name: Cache verified native screen archives (Windows)
        if: steps.cache.outputs.cache-hit != 'true' || steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .native-screen\downloads
          key: native-screen-archives-v1-ci-windows-x64-${{ hashFiles('apps/client/native/screen-share/scripts/fetchObs.cjs', 'apps/client/native/screen-share/scripts/buildTools.cjs', 'apps/client/native/screen-share/src/vendor/obs/sources.json', 'apps/client/native/screen-share/src/vendor/obs/runtime-inputs.json', 'apps/client/native/screen-share/src/capture/runtime-additions.json') }}

      - name: Build native screen runtime and corresponding-source inputs (Windows)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Git = (Get-Command git -CommandType Application | Select-Object -First 1).Source
          npm run prepare:native-screen -- --python="$env:PYTHON" --git="$Git" --jobs=4

      - name: Fetch corresponding-source inputs for the cached runtime (Windows)
        if: steps.cache.outputs.cache-hit == 'true' && steps.sources.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Git = (Get-Command git -CommandType Application | Select-Object -First 1).Source
          npm run prepare:native-screen -- --python="$env:PYTHON" --git="$Git" --fetch-only

      - name: Verify native runtime against this checkout
        run: node apps/client/native/screen-share/scripts/verifyOutputs.cjs win

      - name: Exercise native screen contracts and legal metadata
        run: |
          npm run test:native-screen --workspace=apps/client
          npm run test:legal

      - name: Save verified native runtime
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/client/native/screen-share/bin/win32-x64
            apps/client/native/screen-share/licenses
            apps/client/native/screen-share/LICENSE
            apps/client/native/screen-share/THIRD_PARTY_NOTICES
          key: ${{ steps.key.outputs.key }}

      - name: Package reusable corresponding sources (Windows)
        if: steps.sources.outputs.cache-hit != 'true'
        env:
          MONKY_SOURCE_XZ: required
        run: npm run pack:native-sources -- --version=0.0.0-ci

      - name: Verify corresponding sources against this checkout (Windows)
        run: node scripts/native-sources-cache.cjs verify win

      - name: Save verified corresponding sources (Windows)
        if: steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            release/monky-native-sources-0.0.0-ci.json
            release/monky-native-sources-0.0.0-ci.tar.xz
          key: ${{ steps.key.outputs.sources_key }}

      - name: Install FFmpeg for generated voice fixtures
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -hide_banner -version

      - name: Exercise prepared application startup and scenarios
        shell: bash
        run: |
          node scripts/qa.js home --smoke
          npm run test:qa

      # Mirror the release pipeline: tsc does not copy the .sql migration files
      # into the compiled server output, so we copy them next to the compiled
      # DatabaseConnection.js before packaging.
      - name: Copy database migrations into server dist
        shell: bash
        run: |
          mkdir -p apps/server/dist/infrastructure/database/migrations
          cp apps/server/src/infrastructure/database/migrations/*.sql \
             apps/server/dist/infrastructure/database/migrations/

      # Packaging check only (unpacked --dir, no publish). This rebuilds native
      # modules against the Electron ABI on a real windows-2022 runner, catching
      # native build and packaging regressions on every PR without a release.
      - name: Package win (dir, no publish)
        working-directory: apps/client
        run: npx --no-install electron-builder --win --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_gyp: ${{ env.NODE_GYP_PATH }}

      - name: Exercise shortcut capture and worker recovery
        shell: bash
        run: |
          npm exec -- tsc -p apps/client/tsconfig.test.json
          node apps/client/test/shortcutsDomSmoke.cjs
          node apps/client/test/shortcutWorkerSmoke.cjs

      - name: Export verified desktop build
        env:
          MONKY_NATIVE_CACHE_KEY: ${{ steps.key.outputs.key }}
        run: node scripts/ci-build-artifact.js collect win "${{ runner.temp }}/ci-build-win"
      - name: Upload reusable desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-win-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build-win
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  package-mac:
    name: Package check (mac)
    needs: [mac-native, mac-sources]
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime before tests
        run: npm exec --no -- install-electron

      - name: Build workspaces
        run: npm run build

      - name: Verify macOS DMG packaging dependencies
        run: node -e "require('dmg-builder/out/dmgLicense.js')"

      - name: Download the tested native runtime
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.mac-native.outputs.artifact }}
          path: ${{ runner.temp }}/mac-native

      - name: Download corresponding sources and notices
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.mac-sources.outputs.artifact }}
          path: ${{ runner.temp }}/mac-sources

      - name: Verify native runtime against its corresponding sources
        run: |
          arch -x86_64 /usr/bin/true
          tar -xf "$RUNNER_TEMP/mac-native/mac-native-runtime.tar" -C apps/client/native/screen-share
          tar -xf "$RUNNER_TEMP/mac-sources/mac-native-sources.tar"
          node apps/client/native/screen-share/scripts/verifyOutputs.cjs mac --legal

      - name: Exercise native screen contracts and legal metadata
        run: |
          npm run test:native-screen --workspace=apps/client
          npm run test:legal

      - name: Install FFmpeg for generated voice fixtures
        run: |
          # Homebrew's minimal formula omits libvorbis; use the complete codec set.
          brew install ffmpeg-full
          ffmpeg_bin="$(brew --prefix ffmpeg-full)/bin"
          echo "$ffmpeg_bin" >> "$GITHUB_PATH"
          export PATH="$ffmpeg_bin:$PATH"
          ffmpeg -hide_banner -version
          ffmpeg -hide_banner -encoders | grep -E '^[[:space:]]*A[^[:space:]]*[[:space:]]+libvorbis[[:space:]]'

      - name: Prepare an isolated macOS test Keychain
        run: python scripts/macos-test-keychain.py setup

      - name: Exercise prepared application startup and scenarios
        shell: bash
        run: |
          node scripts/qa.js home --smoke
          npm run test:qa

      # Mirror the release pipeline: tsc does not copy the .sql migration files
      # into the compiled server output, so we copy them next to the compiled
      # DatabaseConnection.js before packaging.
      - name: Copy database migrations into server dist
        shell: bash
        run: |
          mkdir -p apps/server/dist/infrastructure/database/migrations
          cp apps/server/src/infrastructure/database/migrations/*.sql \
             apps/server/dist/infrastructure/database/migrations/

      # Packaging check only (unpacked --dir, no publish), on a real macos-15
      # runner, catching native and packaging regressions without a release.
      - name: Package mac (dir, no publish)
        working-directory: apps/client
        run: npx --no-install electron-builder --mac --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Exercise shortcut capture and worker recovery
        shell: bash
        run: |
          npm exec -- tsc -p apps/client/tsconfig.test.json
          node apps/client/test/shortcutsDomSmoke.cjs
          node apps/client/test/shortcutWorkerSmoke.cjs

      - name: Export verified desktop build
        env:
          MONKY_NATIVE_CACHE_KEY: ${{ needs.mac-native.outputs.cache-key }}
        run: node scripts/ci-build-artifact.js collect mac "${{ runner.temp }}/ci-build-mac"
      - name: Upload reusable desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-mac-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build-mac
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

      - name: Restore macOS Keychain configuration
        if: always()
        run: python scripts/macos-test-keychain.py restore

  # Preserve the required check names: neither a failed nor a skipped lane may turn the
  # original build gate green.
  build:
    name: Build check (${{ matrix.platform }})
    if: always()
    needs: [package-win, package-mac, client-dom, client-dom-mac, mac-native-sources]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [win, mac]
    steps:
      - name: Require packaging, DOM and native hardware success
        env:
          PACKAGE_WIN: ${{ needs.package-win.result }}
          PACKAGE_MAC: ${{ needs.package-mac.result }}
          DOM_WIN: ${{ needs.client-dom.result }}
          DOM_MAC: ${{ needs.client-dom-mac.result }}
          NATIVE_MAC: ${{ needs.mac-native-sources.result }}
        run: |
          for result in "$PACKAGE_WIN" "$PACKAGE_MAC" "$DOM_WIN" "$DOM_MAC" "$NATIVE_MAC"; do
            test "$result" = success
          done