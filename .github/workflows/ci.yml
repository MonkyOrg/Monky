name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light-native:
    name: Light native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            arch: x64
          - os: macos-15-intel
            target: macos-x64
            arch: x64
          - os: macos-15
            target: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read native toolchain pins
        id: native-tools
        shell: pwsh
        run: |
          $manifest = Join-Path 'apps' (Join-Path 'light' 'dependencies.json')
          $tools = (Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json).buildTools
          if ($tools.ciCmake -notmatch '^\d+\.\d+\.\d+$' -or $tools.ciXcode -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw 'Invalid native toolchain version in dependencies.json'
          }
          "cmake=$($tools.ciCmake)" >> $env:GITHUB_OUTPUT
          "xcode=$($tools.ciXcode)" >> $env:GITHUB_OUTPUT
      - name: Select the qualified Xcode toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ steps.native-tools.outputs.xcode }}.app/Contents/Developer"
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Install the compatible CMake series
        run: python -m pip install --disable-pip-version-check cmake==${{ steps.native-tools.outputs.cmake }}
      - name: Cache verified SDK archives
        uses: actions/cache@v4
        with:
          path: apps/light/build/downloads
          key: light-sdk-${{ matrix.target }}-${{ hashFiles('apps/light/dependencies.json') }}
      - name: Install build-time JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Build native components
        run: npm run build:light -- --arch ${{ matrix.arch }}
      - name: Prepare an isolated macOS test Keychain
        if: runner.os == 'macOS'
        shell: python
        run: |
          import json, os, pathlib, secrets, shlex, subprocess

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          state_file = root / "monky-light-keychain-state.json"
          if state_file.exists():
              raise RuntimeError("A previous Light Keychain fixture was not restored")

          def security(*args):
              return subprocess.check_output(["security", *args], text=True).strip()

          keychain = str(root / ("monky-light-" + secrets.token_hex(8) + ".keychain-db"))
          previous = {
              "default": shlex.split(security("default-keychain", "-d", "user"))[0],
              "search": shlex.split(security("list-keychains", "-d", "user")),
              "fixture": keychain,
          }
          state_file.write_text(json.dumps(previous), encoding="utf-8")
          password = secrets.token_hex(24)
          print("::add-mask::" + password, flush=True)
          security("create-keychain", "-p", password, keychain)
          security("set-keychain-settings", "-lut", "21600", keychain)
          security("unlock-keychain", "-p", password, keychain)
          security("list-keychains", "-d", "user", "-s", keychain)
          security("default-keychain", "-d", "user", "-s", keychain)
      - name: Exercise native components without media devices
        run: node --test scripts/test-light-contracts.js scripts/test-light-build.js apps/light/test/platform_components.test.cjs apps/light/test/identity_key_interop.test.cjs apps/light/test/console_control.test.cjs apps/light/test/websocket_transport.test.cjs
      - name: Prepare disposable voice interoperability fixtures
        run: |
          npm rebuild mediasoup electron esbuild
          npm run build --workspace=apps/server
      - name: Exercise native and Chromium voice through a real isolated server
        run: node --test apps/light/test/server_fixture.test.cjs apps/light/test/headless_interop.test.cjs apps/light/test/browser_interop.test.cjs
      - name: Restore macOS Keychain configuration
        if: always() && runner.os == 'macOS'
        shell: python
        run: |
          import json, os, pathlib, subprocess

          state_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "monky-light-keychain-state.json"
          if state_file.exists():
              previous = json.loads(state_file.read_text(encoding="utf-8"))
              operations = [
                  ["list-keychains", "-d", "user", "-s", *previous["search"]],
                  ["default-keychain", "-d", "user", "-s", previous["default"]],
              ]
              if pathlib.Path(previous["fixture"]).exists():
                  operations.append(["delete-keychain", previous["fixture"]])
              errors = []
              for args in operations:
                  result = subprocess.run(["security", *args], text=True, capture_output=True)
                  if result.returncode:
                      errors.append(args[0] + ": " + result.stderr.strip())
              if errors:
                  raise RuntimeError("Light Keychain cleanup failed: " + "; ".join(errors))
              state_file.unlink()

  bot-tests:
    name: Bot interactions and SDK package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without native build scripts
        run: npm ci --ignore-scripts
      - name: Prepare the SFU worker for real voice transport tests
        run: npm rebuild mediasoup
      - name: Build shared contracts
        run: npm run build --workspace=packages/shared
      - name: Test bot contracts and SDK
        run: |
          node scripts/test-changelog.js
          node --test scripts/test-light-contracts.js scripts/test-light-build.js
          npm run test --workspace=packages/shared
          npm run test --workspace=packages/bot-sdk
      - name: Test server, client state and real bot conversations
        run: |
          npm run build --workspace=apps/server
          npm run test:bots --workspace=apps/server
          node --test apps/server/dist/test-online-preview.js apps/server/dist/test-voice.js apps/server/dist/test-voice-mode.js apps/server/dist/test-server-settings.js apps/server/dist/test-startup-lifecycle.js
          # libuiohook initializes X11 even when the tests inject a passive mock.
          xvfb-run -a npm run test --workspace=apps/client
          npm exec -- tsc -p apps/client/tsconfig.electron.json
          node scripts/test-bot-e2e.js
      - name: Exercise an isolated SDK installation
        run: |
          node scripts/pack-bot-sdk.js 0.0.0-ci
          node scripts/test-bot-sdk-package.js release/monky-bot-sdk-0.0.0-ci.tgz

  docs-sync:
    name: Docs traduzidos em sincronia
    runs-on: ubuntu-latest
    # Documentacao aqui deriva: ja aconteceu com o caminho de Configuracoes no
    # template de bug e com as colunas do board no AGENTS.md. Com README e
    # CONTRIBUTING em dois idiomas a superficie dobra, entao o CI cobra o par.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir slug dos templates de discussao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # O GitHub aplica o template de discussao casando o nome do arquivo
          # com o slug da categoria. Quando nao casa, o formulario simplesmente
          # nao aparece — sem erro e sem aviso. Ja aconteceu duas vezes aqui.
          slugs=$(gh api graphql -f query='
            { repository(owner: "${{ github.repository_owner }}", name: "'"${GITHUB_REPOSITORY#*/}"'") {
                discussionCategories(first: 50) { nodes { slug } } } }' \
            -q '.data.repository.discussionCategories.nodes[].slug')

          echo "Categorias existentes:"; echo "$slugs" | sed 's/^/  /'

          fail=0
          shopt -s nullglob
          for f in .github/DISCUSSION_TEMPLATE/*.yml .github/DISCUSSION_TEMPLATE/*.yaml; do
            base=$(basename "$f"); slug="${base%.*}"
            if ! echo "$slugs" | grep -Fxq "$slug"; then
              echo "::error file=$f::Nao existe categoria de Discussions com o slug '$slug'. O template nao sera aplicado."
              fail=1
            else
              echo "  ok: $base casa com a categoria '$slug'"
            fi
          done
          exit $fail

      - name: Conferir pares PT/EN
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ -z "$BASE" ]; then
            echo "Sem contexto de PR (execucao manual) — nada a conferir."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Arquivos alterados:"; echo "$changed" | sed 's/^/  /'

          fail=0
          check_pair() {
            local pt="$1" en="$2"
            local pt_changed en_changed
            pt_changed=$(echo "$changed" | grep -Fx "$pt" || true)
            en_changed=$(echo "$changed" | grep -Fx "$en" || true)
            if [ -n "$pt_changed" ] && [ -z "$en_changed" ]; then
              echo "::error file=$pt::$pt mudou mas $en nao. Atualize a traducao no mesmo PR."
              fail=1
            fi
            if [ -n "$en_changed" ] && [ -z "$pt_changed" ]; then
              echo "::error file=$en::$en mudou mas $pt nao. Atualize a versao em portugues no mesmo PR."
              fail=1
            fi
          }

          check_pair "README.md" "README.en.md"
          check_pair "CONTRIBUTING.md" "CONTRIBUTING.en.md"
          check_pair "apps/light/README.md" "apps/light/README.en.md"
          check_pair "apps/light/QA.md" "apps/light/QA.en.md"

          # O site de docs (VitePress) tem PT na raiz de docs-site/ e EN em
          # docs-site/en/. Cada pagina precisa manter o par no mesmo PR.
          shopt -s nullglob
          for pt in docs-site/*.md; do
            base=$(basename "$pt")
            if [ ! -f "docs-site/en/$base" ]; then
              echo "::error file=$pt::$pt nao tem pagina correspondente em docs-site/en/$base."
              fail=1
            fi
            check_pair "$pt" "docs-site/en/$base"
          done

          for en in docs-site/en/*.md; do
            base=$(basename "$en")
            if [ ! -f "docs-site/$base" ]; then
              echo "::error file=$en::$en nao tem pagina correspondente em docs-site/$base."
              fail=1
            fi
          done

          if [ "$fail" -eq 0 ]; then
            echo "Pares PT/EN consistentes."
          fi
          exit $fail

      # Subir o PROTOCOL_VERSION faz cliente e servidor se recusarem (validators
      # exige igualdade exata), entao e breaking change e precisa sair como
      # major. Ja passou como `feat:` uma vez e publicou uma minor (#338).
      - name: Mudanca de protocolo exige release major
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: node scripts/check-protocol-bump.js

  build:
    name: Build check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      # Upgrade node-gyp so @electron/rebuild can find VS 2022
      - name: Install node-gyp globally (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@latest
          echo "NODE_GYP_PATH=$(npm prefix -g)/node_modules/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV

      - name: Build workspaces
        run: npm run build

      - name: Install FFmpeg for generated voice fixtures
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              choco install ffmpeg --yes --no-progress --limit-output
            else
              brew install ffmpeg
            fi
          fi
          ffmpeg -hide_banner -version

      - name: Exercise client DOM and microphone state in Electron
        shell: bash
        run: |
          npm run test:bots:ui --workspace=apps/client
          npm run test:development --workspace=apps/client
          npm run test:updates --workspace=apps/client
          npm run test:editing --workspace=apps/client
          npm run test:screens --workspace=apps/client
          node packages/bot-sdk/test-browser/voiceRendererSmoke.cjs
          node apps/client/test/userContextMenuSmoke.cjs
          node apps/client/test/audioDeviceSmoke.cjs
          node apps/client/test/liveAudioDeviceSmoke.cjs
          node apps/client/test/dropdownSmoke.cjs
          node apps/client/test/tooltipSmoke.cjs
          node apps/client/test/microphoneStateSmoke.cjs
          node apps/client/test/microphoneTestSmoke.cjs
          node apps/client/test/settingsNavigationSmoke.cjs
          node apps/client/test/settingsNavigationSmoke.cjs --release-notes
          npm run test:settings:ui --workspace=apps/client
          npm run test:camera --workspace=apps/client
          node apps/client/test/footerControlsSmoke.cjs
          npm run test:transport --workspace=apps/client

      # Mirror the release pipeline: tsc does not copy the .sql migration files
      # into the compiled server output, so we copy them next to the compiled
      # DatabaseConnection.js before packaging.
      - name: Copy database migrations into server dist
        shell: bash
        run: |
          mkdir -p apps/server/dist/infrastructure/database/migrations
          cp apps/server/src/infrastructure/database/migrations/*.sql \
             apps/server/dist/infrastructure/database/migrations/

      # Packaging check only (unpacked --dir, no publish). This compiles and
      # rebuilds any native modules against the Electron ABI on real
      # windows-2022 / macos-latest runners, catching native build and
      # packaging regressions on every PR without generating a release.
      - name: Package ${{ matrix.platform }} (dir, no publish)
        working-directory: apps/client
        run: npx --no-install electron-builder --${{ matrix.platform }} --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_gyp: ${{ env.NODE_GYP_PATH || '' }}

      - name: Exercise shortcut capture and worker recovery
        shell: bash
        run: |
          npm exec -- tsc -p apps/client/tsconfig.test.json
          node apps/client/test/shortcutsDomSmoke.cjs
          node apps/client/test/shortcutWorkerSmoke.cjs
