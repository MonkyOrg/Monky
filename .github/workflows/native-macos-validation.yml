name: Native macOS media validation

# Called by CI after the native runtime is compiled or restored once. Each architecture is
# exercised on its own hardware with the exact binaries that packaging ships. There is no push
# trigger: the merged tree is identical to the PR tree CI already validated (strict up-to-date
# branches), and a post-merge rerun could neither block nor change the release.
on:
  workflow_call:
    inputs:
      runtime-artifact:
        description: Artifact with the bin/darwin-* runtime tarball from the calling run.
        type: string
        required: true

permissions:
  contents: read

jobs:
  sources:
    name: Native media (${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The mediasoup SFU worker is unused here and has no darwin-x64 prebuild, so its install
      # script would compile it from source for ~15 minutes on Intel.
      - name: Install dependencies and compile the application contracts
        run: |
          npm ci --ignore-scripts
          npm run postinstall
          npm rebuild esbuild
          npm run build
      - name: Build native audio and verify AppKit lifecycle requirements
        run: |
          npm exec --no -- node-gyp rebuild --directory=apps/client/native/screen-audio
          node --test apps/client/native/screen-audio/test/macAudioRuntime.test.cjs
      - name: Download the shipped native runtime
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.runtime-artifact }}
          path: ${{ runner.temp }}/mac-native
      - name: Verify source inventory, binary hashes and runtime on this hardware
        run: |
          tar -xf "$RUNNER_TEMP/mac-native/mac-native-runtime.tar" -C apps/client/native/screen-share
          node apps/client/native/screen-share/scripts/verifyOutputs.cjs mac --arch=${{ matrix.arch }}
      - name: Exercise native screen contracts
        run: npm run test:native-screen --workspace=apps/client
      - name: Verify bounded native source transport and cleanup
        run: |
          node --test apps/client/native/screen-share/test/macScreenProvider.test.cjs apps/client/native/screen-share/test/macVideoCapture.test.cjs
          node apps/client/native/screen-share/test/macNativeHostSmoke.cjs
      - name: Exercise actual VideoToolbox H264 encoding and callback retirement
        run: apps/client/native/screen-share/bin/darwin-${{ matrix.arch }}/monky-screen-mac --encoder-smoke
      - name: Exercise native AV1 software encoding, keyframes and source-free profiles
        run: node --test apps/client/native/screen-share/test/macAv1Encoder.test.cjs