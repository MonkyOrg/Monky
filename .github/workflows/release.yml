name: Release

on:
  push:
    branches: [main]
    # Release so faz sentido quando o software muda. Documentacao, imagens e
    # arquivos de configuracao do GitHub nao entram no binario — gerar release
    # para eles queima numero de versao e confunde quem acompanha o changelog.
    #
    # O GitHub so pula o workflow quando TODOS os arquivos do push casam com a
    # lista: commit que mexe em documentacao e codigo junto continua gerando
    # release, como deve.
    #
    # ci.yml e release.yml tambem ficam de fora: os dois duplicam o mesmo setup
    # de build (Node 22, Python 3.11, MSVC, npm ci + npm run build). Se alguem
    # corrigir o setup num e esquecer o outro, pular a release esconderia a
    # divergencia ate a proxima publicacao. Workflow que toca em build precisa
    # ser exercitado.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'images/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Beta tag to promote to a stable release (e.g. v1.8.0-beta). Leave empty to build a beta from the current ref.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.event.inputs.promote_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      channel: ${{ steps.bump.outputs.channel }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # push to main / manual dispatch (no tag) -> beta prerelease.
      # manual dispatch with a beta tag -> promote that beta to a clean stable.
      - name: Calculate Semantic Version
        id: bump
        env:
          PROMOTE_TAG: ${{ github.event.inputs.promote_tag }}
          RELEASE_CHANNEL: beta
        run: node scripts/calculate-version.js

      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.promote_tag }}" ]; then
            echo "checkout_ref=${{ github.event.inputs.promote_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      # Upgrade node-gyp so @electron/rebuild can find VS 2022
      - name: Install node-gyp globally (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@latest
          echo "NODE_GYP_PATH=$(npm prefix -g)/node_modules/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV

      - name: Build workspaces
        run: npm run build

      - name: Set build version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          for f in apps/client/package.json; do
            node -e "const f='$f';const p=require('./'+f);p.version='${VERSION}';require('fs').writeFileSync(f, JSON.stringify(p, null, 2)+'\n');"
          done
          echo "Packaged version set to ${VERSION}"

      - name: Build ${{ matrix.platform }} distributables
        working-directory: apps/client
        shell: bash
        run: |
          mkdir -p node_modules
          # A secret that does not exist becomes an empty string, and an empty
          # CSC_LINK is not the same as an absent one: electron-builder treats it
          # as a certificate path and dies with "<cwd> not a file". So the signing
          # variables are only exported once they actually carry a value (#327).
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          fi
          if [ -n "$MAC_APPLE_ID" ]; then
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          fi
          npx --no-install electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_gyp: ${{ env.NODE_GYP_PATH || '' }}
          # macOS ties the Screen Recording permission to the app's code signing
          # identity. Without a stable Developer ID the app is ad-hoc signed, its
          # identity changes on every build, and a permission granted before an
          # update stops applying to the new binary (#327).
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The artifact keeps a single root directory on purpose: upload-artifact
      # resolves the artifact root as the common ancestor of the search paths,
      # so mixing another output folder here would nest every file under those
      # folders and break the flat paths in checksums-sha256.txt.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  cli:
    name: Pack CLI tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tarball only needs shared + server, so the Electron/native download
      # triggered by the Client's install scripts is skipped here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build shared and server
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/server

      - name: Build bot-sdk
        run: npm run build --workspace=packages/bot-sdk

      - name: Test bot-sdk interactions
        if: hashFiles('packages/bot-sdk/test/client.test.cjs') != ''
        run: npm run test --workspace=packages/bot-sdk

      - name: Pack CLI
        id: pack
        shell: bash
        run: |
          # Tags cut before #285 have no packer; a promotion of an older beta
          # simply ships without the CLI tarball instead of failing the release.
          if [ ! -f scripts/pack-cli.js ]; then
            echo "packed=false" >> "$GITHUB_OUTPUT"
            echo "This ref predates the CLI tarball; skipping."
            exit 0
          fi
          node scripts/pack-cli.js "${{ needs.version.outputs.version }}"
          echo "packed=true" >> "$GITHUB_OUTPUT"

      - name: Upload CLI artifact
        if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-cli
          if-no-files-found: error
          retention-days: 7
          path: release/monky-cli-*.tgz

      - name: Pack bot-sdk
        id: pack-sdk
        shell: bash
        run: |
          if [ ! -f scripts/pack-bot-sdk.js ]; then
            echo "packed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/pack-bot-sdk.js "${{ needs.version.outputs.version }}"
          echo "packed=true" >> "$GITHUB_OUTPUT"

      - name: Exercise isolated bot-sdk installation
        if: steps.pack-sdk.outputs.packed == 'true' && hashFiles('scripts/test-bot-sdk-package.js') != ''
        run: node scripts/test-bot-sdk-package.js "release/monky-bot-sdk-${{ needs.version.outputs.version }}.tgz"

      - name: Upload bot-sdk artifact
        if: steps.pack-sdk.outputs.packed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-bot-sdk
          if-no-files-found: error
          retention-days: 7
          path: release/monky-bot-sdk-*.tgz

  release:
    name: Publish GitHub Release
    needs: [version, build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ needs.version.outputs.prev_tag }}"
          echo "Previous tag: ${PREV_TAG:-<none>}"

          # scripts/generate-changelog.js turns the commit range into the
          # friendly, grouped notes (Novidades / Correções / Outros) shown both
          # on the release and inside the client (#547). It reads the curated
          # "#NNN:" lines from commit bodies, falls back to bullets then the
          # subject, and appends the comparison link.
          NOTES=$(node scripts/generate-changelog.js \
            --prev "$PREV_TAG" \
            --version "${{ needs.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY")

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate checksums and sign artifacts
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.tgz' \) \
            -exec sha256sum {} + | sort > checksums-sha256.txt
          echo "=== Checksums ==="
          cat checksums-sha256.txt

      - name: Sign checksums with Cosign (keyless)
        run: cosign sign-blob --yes --output-signature artifacts/checksums-sha256.txt.sig --output-certificate artifacts/checksums-sha256.txt.crt artifacts/checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.channel == 'beta' && format('Monky v{0} (Beta)', needs.version.outputs.version) || format('Monky v{0}', needs.version.outputs.version) }}
          body: |
            ${{ needs.version.outputs.channel == 'beta' && '> ⚠️ **Versão beta** — em validação. Só recebe automaticamente quem ativou "Receber versões beta" nas Configurações. Após validada, é promovida a estável.' || 'Release estável do Monky.' }}

            Gerada a partir de `${{ needs.version.outputs.checkout_ref }}`.

            ### Downloads

            **Monky (aplicativo)**
            - **Windows**: instalador `.exe` (NSIS) e `.exe` portátil
            - **macOS**: `.dmg` (Intel + Apple Silicon) e `.zip`

            **Monky Server (painel do host)**
            - `Monky-Server-*` — instalador desktop para administrar o servidor pela interface gráfica

            **Monky CLI**
            - `monky-cli-${{ needs.version.outputs.version }}.tgz` — instale com:
              ```bash
              npm install -g https://github.com/MonkyOrg/Monky/releases/download/v${{ needs.version.outputs.version }}/monky-cli-${{ needs.version.outputs.version }}.tgz
              ```

            **Bot SDK (@monky/bot-sdk)**
            - `monky-bot-sdk-${{ needs.version.outputs.version }}.tgz` — instale com:
              ```bash
              npm install https://github.com/MonkyOrg/Monky/releases/download/v${{ needs.version.outputs.version }}/monky-bot-sdk-${{ needs.version.outputs.version }}.tgz
              ```

            ### Verificação de autenticidade
            Todos os artefatos são assinados com [Sigstore Cosign](https://docs.sigstore.dev/) (keyless, via OIDC do GitHub Actions).

            ```bash
            # 1. Verificar checksums
            sha256sum -c checksums-sha256.txt

            # 2. Verificar assinatura (requer cosign instalado)
            cosign verify-blob \
              --signature checksums-sha256.txt.sig \
              --certificate checksums-sha256.txt.crt \
              --certificate-identity-regexp "https://github.com/MonkyOrg/Monky" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              checksums-sha256.txt
            ```

            ### Changelog
            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          fail_on_unmatched_files: false

      # Assets are uploaded here instead of through the action above: uploading
      # every artifact in parallel silently dropped two files once the Server
      # GUI doubled the payload, publishing an incomplete release. Uploading one
      # file at a time with retries, then asserting the final asset list, makes
      # a missing artifact fail the job instead of going unnoticed.
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          cd artifacts
          shopt -s nullglob
          FILES=( *.exe *.dmg *.zip *.tgz *.blockmap latest*.yml checksums-sha256.txt* )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No artifacts to upload." >&2
            exit 1
          fi

          for file in "${FILES[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                uploaded=true
                break
              fi
              echo "Upload of $file failed (attempt $attempt); retrying..."
              sleep 15
            done
            if [ "$uploaded" != true ]; then
              echo "::error::Could not upload $file after 3 attempts"
              exit 1
            fi
          done

          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/published.txt
          printf '%s\n' "${FILES[@]}" | sort > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/published.txt; then
            echo "::error::Published assets do not match the built artifacts"
            exit 1
          fi
          echo "All ${#FILES[@]} assets published."
